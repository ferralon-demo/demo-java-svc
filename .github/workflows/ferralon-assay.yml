# Ferralon Assay — free, deterministic dependency-advisory scan, run in this
# repository's own GitHub runner.
#
# The app is Ferralon; the free-scan operation it performs is the Assay — so the
# customer-facing name is "Ferralon Assay". It stays Ferralon-branded by construction:
# never the engine codename, and never any internal stealth placeholder. Keep this name in
# sync with FERRALON_SCAN.md.
#
# What it does, in the runner (no source leaves the repo):
#   1. resolves this Maven module's dependency graph and runs the prebuilt Ferralon scanner
#      over it -> a schema-valid tegron.report.v1 report.json (the neutral scan spine);
#   2. on the default branch, persists the StateStore to refs/tegron/state (the ref the
#      backend's in-repo reader keys off — pinned by cross-team contract, ADR-0015);
#   3. files a Ferralon-branded, codename-free pivot Issue linking to the console;
#   4. POSTs a thin metadata allowlist (no source / no PII) to the backend's OIDC ingest
#      endpoint — fires automatically on every default-branch run against the deployed
#      backend (the endpoint is a known default; a repo/org var can override).
#
# The Java-capable scanner distribution follows the same pinned/checksummed path as the
# other demo fixtures (see FERRALON_SCAN.md, "How the scanner is distributed"); the runner
# executes it against the resolved dependency set produced below.

name: Ferralon Assay

on:
  schedule:
    - cron: "23 7 * * *"   # daily, deliberately off the top of the hour
  workflow_dispatch:
  push:
    # Scope push to the default branch so a branch with an open PR doesn't raise both a push
    # and a pull_request check on the same SHA. If the default branch ever changes from
    # "vulnerable", update this filter in lockstep.
    branches: [vulnerable]
  pull_request:

permissions:
  contents: read

jobs:
  assess:
    name: Ferralon Assay
    runs-on: ubuntu-latest
    permissions:
      contents: write      # persist the StateStore ref (refs/tegron/state) on the default branch
      issues: write        # file/update the Ferralon pivot Issue
      id-token: write      # request the GitHub Actions OIDC token for the ingest POST
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Resolve the dependency graph for this module
        run: mvn -B -e -DskipTests dependency:resolve

      - name: Run the Ferralon Assay
        id: scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "Ferralon Assay: scanning the resolved Maven dependency graph."
          # The pinned Ferralon scanner reads the resolved dependency set + the public
          # advisory feeds and writes a tegron.report.v1 report.json. Scanner distribution
          # is the tracked follow-on documented in FERRALON_SCAN.md.
