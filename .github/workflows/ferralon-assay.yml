# Ferralon Assay — free, deterministic dependency-advisory scan, run in this
# repository's own GitHub runner.
#
# The app is Ferralon; the free-scan operation it performs is the Assay — so the
# customer-facing name is "Ferralon Assay". It stays Ferralon-branded by construction:
# never the engine codename, and never any internal stealth placeholder. Keep this name in
# sync with FERRALON_SCAN.md.
#
# What it does, in the runner (no source leaves the repo):
#   1. resolves this Maven module's dependency graph and runs the pinned ferralon-assay
#      scanner over it -> a schema-valid tegron.report.v1 report.json (the neutral scan
#      spine);
#   2. on the default branch, persists the StateStore to refs/tegron/state (the ref the
#      backend's in-repo reader keys off — pinned by cross-team contract, ADR-0015);
#   3. uses the scanner's OWN customer-facing surfaces — a pinned Issue and a sticky PR
#      comment — this repo carries no custom pivot-Issue script, unlike demo-go-svc.
#
# The scanner is delivered by the pinned, checksummed `ferralon-ai/ferralon-assay` Action
# (tag-pinned below), which fetches a versioned scanner release at run time — no binary is
# committed to this repository.

name: Ferralon Assay

on:
  schedule:
    - cron: "23 7 * * *"   # daily, deliberately off the top of the hour
  workflow_dispatch:
  push:
    # Scope push to the default branch so a branch with an open PR doesn't raise both a push
    # and a pull_request check on the same SHA. If the default branch ever changes from
    # "vulnerable", update this filter in lockstep.
    branches: [vulnerable]
  pull_request:

permissions:
  contents: read

jobs:
  assess:
    name: Ferralon Assay
    runs-on: ubuntu-latest
    permissions:
      contents: write       # persist the StateStore ref (refs/tegron/state) on the default branch
      issues: write         # the scanner's own pinned-Issue surface
      pull-requests: write  # the scanner's own sticky PR-comment surface
      id-token: write       # request the GitHub Actions OIDC token for the ingest POST
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Resolve the dependency graph for this module
        run: mvn -B -e -DskipTests dependency:resolve

      - name: Run the Ferralon Assay
        id: scan
        # Pinned scanner delivery via the composite Action (fetches a versioned scanner
        # release at run time and builds nothing — no binary committed to this repo). The
        # Action's own scanner-version default pins the exact scanner bytes it fetches;
        # scanner-sha256 is a consumer opt-in checksum pin, left unset here.
        uses: ferralon-ai/ferralon-assay@v0.3.0
        with:
          mode: baseline
          target: .
          out: ${{ runner.temp }}/out
          subject-repo: ${{ github.repository }}
          revision: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          # Persist the durable StateStore ref only on the default branch (the baseline
          # posture). A PR run — github.ref_name is "<n>/merge" — stays stateless.
          state-ref: refs/tegron/state
          state-repo: ${{ github.ref_name == github.event.repository.default_branch && github.repository || '' }}
