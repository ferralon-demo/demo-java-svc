# Ferralon Assay — free, deterministic dependency-advisory scan, run in this
# repository's own GitHub runner.
#
# The app is Ferralon; the free-scan operation it performs is the Assay — so the
# customer-facing name is "Ferralon Assay". It stays Ferralon-branded by construction:
# never the engine codename, and never any internal stealth placeholder. Keep this name in
# sync with FERRALON_SCAN.md.
#
# What it does, in the runner (no source leaves the repo):
#   1. resolves this Maven module's dependency graph and runs the pinned ferralon-assay
#      scanner over it -> a schema-valid tegron.report.v1 report.json (the neutral scan
#      spine);
#   2. on the default branch, persists the StateStore to refs/tegron/state (the ref the
#      backend's in-repo reader keys off — pinned by cross-team contract, ADR-0015);
#   3. uses the scanner's OWN customer-facing surfaces — a pinned Issue and a sticky PR
#      comment — this repo carries no custom pivot-Issue script, unlike demo-go-svc.
#
# The scanner is delivered by the pinned, checksummed `ferralon-ai/ferralon-assay` Action
# (tag-pinned below), which fetches a versioned scanner release at run time — no binary is
# committed to this repository.
#
# FIXTURE LAYOUT STANDARD (pipeline-test 1.3, 2026-09-22). `vulnerable` is the GOLDEN
# reference: never scanned, never the default branch, protected per repo in the backend.
# `main` is the default branch, the only scanned branch, and the disposable fire target — reset
# from `vulnerable` with `.demo/prep-demo.sh`. The push filter below names `main` so a push to
# the golden branch produces no scan run that a later fire could target. GitHub matches this
# filter against the copy of this file ON THE PUSHED BRANCH, so `vulnerable`'s copy must name
# `main` too — prep-demo.sh resets `main` from `vulnerable`, so that copy is the one that
# survives. The `schedule` trigger runs on whatever branch is the default, so the golden
# branch's exclusion also depends on the default branch staying `main`.

name: Ferralon Assay

on:
  schedule:
    - cron: "23 7 * * *"   # daily, deliberately off the top of the hour
  workflow_dispatch:
  push:
    # The disposable default branch only (see FIXTURE LAYOUT STANDARD above). branches:
    # cannot use a default_branch expression, so the name is hardcoded.
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  assess:
    name: Ferralon Assay
    runs-on: ubuntu-latest
    permissions:
      contents: write       # persist the StateStore ref (refs/tegron/state) on the default branch
      issues: write         # the scanner's own pinned-Issue surface
      pull-requests: write  # the scanner's own sticky PR-comment surface
      id-token: write       # request the GitHub Actions OIDC token for the ingest POST
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Resolve the dependency graph for this module
        run: mvn -B -e -DskipTests dependency:resolve

      - name: Run the Ferralon Assay
        id: scan
        # Scanner delivery via the composite Action (fetches a versioned scanner
        # release at run time and builds nothing — no binary committed to this repo). We
        # follow the moving @v0.3 alias so patch releases land without per-patch churn;
        # scanner bytes still stay exact via the alias leaf's scanner-version default.
        # scanner-sha256 is a consumer opt-in exact-patch checksum pin, left unset here.
        uses: ferralon-ai/ferralon-assay@v0.5
        with:
          mode: baseline
          target: .
          out: ${{ runner.temp }}/out
          subject-repo: ${{ github.repository }}
          revision: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          # Persist the durable StateStore ref only on the default branch (the baseline
          # posture). A PR run — github.ref_name is "<n>/merge" — stays stateless.
          # Link this repo's runs to the Ferralon console: a canonical-ref (main) run pushes its
          # report to the run-snapshot sink (report_runs). The auto-prove worker enumerates
          # fireable runs ONLY from report_runs, so an unlinked scan is invisible to the fire plane.
          link-to-console: "true"
          # STOPGAP (F28, confirmed 2026-09-22 on airflow): the pinned release carries no baked
          # run-snapshot endpoint, so without this a linked run silently pushes nothing.
          # Delete once the release bakes ASSAY_RUNS_URL.
          runs-url: https://api.ferralon.com/runs
          state-ref: refs/tegron/state
          advisory-corpus-repo: ferralon-ai/vulnerability-corpus
          advisory-corpus-ref: main
          advisory-corpus-policy: published-24h
          state-repo: ${{ github.ref_name == github.event.repository.default_branch && github.repository || '' }}
